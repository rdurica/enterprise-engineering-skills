<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nastavení enterprise-engineering-skills</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1b1f24; --muted:#59636e; --line:#d0d7de; --accent:#0b5fff; --accent-fg:#fff; --warn-bg:#fff4d6; --warn-fg:#6b4a00; --own:#e6f0ff; --ok:#1a7f37; --bad:#cf222e; --code-bg:#eef0f2; --focus:#0b5fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1318; --fg:#e6e9ee; --muted:#9aa4b0; --line:#30363d; --accent:#6ea8ff; --accent-fg:#0f1318; --warn-bg:#3b2f0b; --warn-fg:#ffd479; --own:#14253f; --ok:#56d364; --bad:#ff7b72; --code-bg:#1a2029; --focus:#6ea8ff; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width: 60rem; margin: 0 auto; }
  h1 { font-size: 1.5rem; } h2 { font-size: 1.2rem; margin-top: 2rem; }
  fieldset { border:1px solid var(--line); border-radius:6px; min-width:0; }
  fieldset label { margin-right: 1rem; display:inline-flex; align-items:center; gap:.4rem; padding:.25rem .25rem; min-height:1.5rem; }
  input[type=checkbox] { width:1.25rem; height:1.25rem; margin:0; }
  .note { color: var(--muted); font-size: .9em; }
  .table-wrap { overflow-x:auto; max-width:100%; margin-bottom:1rem; }
  table { border-collapse: collapse; width:100%; }
  caption { text-align:left; font-weight:600; font-size:1rem; color:var(--fg); padding:.25rem 0; }
  th, td { text-align:left; padding:.3rem .35rem; border-bottom:1px solid var(--line); vertical-align: middle; }
  select, button { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:.25rem .5rem; min-height:1.5rem; }
  select { max-width:100%; }
  button.primary { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); padding:.5rem 1.2rem; font-weight:600; }
  button:disabled { opacity:.6; cursor:not-allowed; }
  :focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
  .own { background: var(--own); } .badge { font-size:.8em; border:1px solid var(--line); border-radius:10px; padding:0 .5em; }
  td.outside { border-left:4px solid var(--warn-fg); background:var(--warn-bg); }
  .outside .badge { background:var(--warn-bg); color:var(--warn-fg); border-color:var(--warn-fg); font-weight:600; }
  .warnings { background:var(--warn-bg); color:var(--warn-fg); padding:.5rem 1rem; border-radius:6px; }
  pre { background:var(--code-bg); padding:.75rem; overflow:auto; max-height:24rem; white-space:pre-wrap; border-radius:6px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .dirty { color:var(--warn-fg); background:var(--warn-bg); border-radius:10px; padding:0 .6em; font-size:.9em; }
  .actions { display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; }
  .cell { display:flex; gap:.4rem; align-items:center; flex-wrap:wrap; }
  @media (max-width: 40rem) { body { padding:12px; } th, td { padding:.25rem .2rem; } .table-wrap table { min-width:0; } }
</style>
</head>
<body>
<main>
  <h1>Nastavení poskytovatelů a modelů</h1>
  <p class="note">Ukládají se jen odchylky od defaultů packu. Co nezměníte, se řídí aktuálními defaulty.</p>
  <div id="warnings"></div>
  <div id="load-error" role="alert"></div>
  <fieldset id="providers"><legend>Poskytovatelé</legend></fieldset>
  <div id="tables"></div>
  <p class="note" id="save-hint">Uložení přegeneruje agenty a spustí <code>install.sh</code>.</p>
  <p id="no-provider" class="note" hidden>Není vybrán žádný poskytovatel – uložením se odstraní všechny linky.</p>
  <div class="actions"><button class="primary" id="save" type="button" aria-describedby="save-hint">Uložit a nainstalovat</button> <span id="dirty" class="dirty" hidden>Neuložené změny</span> <span id="status" role="status" aria-live="polite"></span> <span id="error" role="alert" class="bad"></span></div>
  <section id="result" hidden aria-live="polite"><h2>Výsledek instalace</h2><div id="result-warnings"></div><pre id="log" tabindex="0" aria-label="Log instalace"></pre></section>
</main>
<script>
"use strict";
const token = new URLSearchParams(location.search).get("token") || "";
const headers = { "X-Setup-Token": token };
try { history.replaceState(null, "", location.pathname); } catch (e) { /* the token stays in memory */ }
let state, draft;
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k === "class") e.className = v; else e[k] = v; }
  e.append(...kids);
  return e;
};
const colName = { model: "Model", effort: "Úroveň (effort)", variant: "Varianta", small_model: "Malý model" };
const noteCs = { linked: "nalinkováno", installed: "nainstalováno", "not found": "nenalezeno" };
let dirty = false, saving = false;
function setDirty(v) { dirty = v; $("dirty").hidden = !v; }
function edited() {
  setDirty(true);
  $("status").textContent = ""; $("status").className = ""; $("error").textContent = "";
  updateHints();
  render();
}
function updateHints() { $("no-provider").hidden = !draft || draft.providers.size > 0; }

function clone(v) { return JSON.parse(JSON.stringify(v)); }

function setPath(root, path, value) {
  let o = root;
  for (const k of path.slice(0, -1)) o = o[k] = o[k] || {};
  o[path[path.length - 1]] = value;
}
function getPath(root, path) {
  let o = root;
  for (const k of path) { if (o == null || typeof o !== "object") return undefined; o = o[k]; }
  return o;
}
function delPath(root, path) {
  const chain = [root];
  for (const k of path.slice(0, -1)) { if (chain[chain.length - 1]?.[k] == null) return; chain.push(chain[chain.length - 1][k]); }
  delete chain[chain.length - 1][path[path.length - 1]];
  for (let i = chain.length - 1; i > 0; i--) if (!Object.keys(chain[i]).length) delete chain[i - 1][path[i - 1]];
}

// One editable value: `section` is "agents" or "opencode", `path` the keys below it, `list` the catalog list.
function field(section, path, def, list, label) {
  const own = getPath(draft[section], path);
  const value = own === undefined ? def : own;
  const outside = !list.includes(value);
  const id = "f-" + section + "-" + path.join("--").replace(/[^A-Za-z0-9_-]/g, "_");
  const select = el("select", { id, "aria-label": label });
  const options = outside ? [value, ...list] : list;
  for (const o of options) select.append(el("option", { value: o, selected: o === value, textContent: o + (o === def ? " (default)" : "") + (o === value && outside ? " (mimo katalog)" : "") }));
  select.onchange = () => {
    if (select.value === def) delPath(draft[section], path); else setPath(draft[section], path, select.value);
    edited();
  };
  const isOwn = own !== undefined && own !== def;
  const reset = el("button", { type: "button", textContent: "Obnovit", hidden: !isOwn, id: id + "-reset", title: "Vrátit default: " + def });
  reset.setAttribute("aria-label", "Obnovit default: " + label);
  reset.onclick = () => { delPath(draft[section], path); edited(); };
  const badge = el("span", { class: "badge", textContent: outside ? "mimo katalog" : isOwn ? "vlastní" : "default" });
  const cell = el("div", { class: "cell" + (outside ? " outside" : ""), }, select, badge, reset);
  const td = el("td", { class: isOwn ? "own" : "" }, cell);
  return td;
}

function renderProviders() {
  const box = $("providers");
  box.replaceChildren(el("legend", { textContent: "Poskytovatelé" }));
  for (const p of state.providers) {
    const cb = el("input", { type: "checkbox", id: "prov-" + p.id, checked: draft.providers.has(p.id) });
    cb.onchange = () => { cb.checked ? draft.providers.add(p.id) : draft.providers.delete(p.id); edited(); };
    box.append(el("label", { htmlFor: cb.id }, cb, " " + p.label + " ", el("span", { class: "note", textContent: "(" + (noteCs[p.note] || p.note) + ")" })));
  }
}

function wrap(table) { return el("div", { class: "table-wrap" }, table); }

function agentTable(provider, plabel) {
  const keys = { claude: ["model", "effort"], codex: ["model", "effort"], cursor: ["model"], opencode: ["model", "variant"], pi: ["model", "variant"] }[provider];
  const cat = state.catalog[provider] || {};
  const listOf = { model: cat.models || [], effort: cat.efforts || [], variant: cat.variants || [] };
  const table = el("table");
  table.append(el("caption", { textContent: "Agenti" }));
  table.append(el("thead", {}, el("tr", {}, el("th", { scope: "col", textContent: "Agent" }), ...keys.map((k) => el("th", { scope: "col", textContent: colName[k] })))));
  const body = el("tbody");
  for (const [agent, tables] of Object.entries(state.defaults.agents)) {
    const cfg = tables[provider];
    if (!cfg) continue;
    const tr = el("tr", {}, el("th", { scope: "row", textContent: agent }));
    for (const k of keys) tr.append(cfg[k] === undefined ? el("td", { textContent: "–" }) : field("agents", [agent, provider, k], cfg[k], listOf[k], colName[k] + " – " + agent + " (" + plabel + ")"));
    body.append(tr);
  }
  table.append(body);
  return wrap(table);
}

function opencodeTable() {
  const cat = state.catalog.opencode || {};
  const d = state.defaults.opencode;
  const table = el("table");
  table.append(el("caption", { textContent: "Hlavní session a built-in agenti" }));
  table.append(el("thead", {}, el("tr", {}, el("th", { scope: "col", textContent: "Položka" }), el("th", { scope: "col", textContent: "Model" }), el("th", { scope: "col", textContent: "Varianta" }))));
  const body = el("tbody");
  for (const k of ["model", "small_model"]) {
    if (d[k] !== undefined) body.append(el("tr", {}, el("th", { scope: "row", textContent: k }), field("opencode", [k], d[k], cat.models || [], colName[k] + " – hlavní session (OpenCode)"), el("td", { textContent: "–" })));
  }
  for (const [id, cfg] of Object.entries(d.agent || {})) {
    body.append(el("tr", {}, el("th", { scope: "row", textContent: id }),
      cfg.model === undefined ? el("td", { textContent: "–" }) : field("opencode", ["agent", id, "model"], cfg.model, cat.models || [], "Model – " + id + " (OpenCode built-in agent)"),
      cfg.variant === undefined ? el("td", { textContent: "–" }) : field("opencode", ["agent", id, "variant"], cfg.variant, cat.variants || [], "Varianta – " + id + " (OpenCode built-in agent)")));
  }
  table.append(body);
  return wrap(table);
}

function renderTables() {
  const box = $("tables");
  box.replaceChildren();
  for (const p of state.providers) {
    if (!draft.providers.has(p.id)) continue;
    const sec = el("section", {}, el("h2", { textContent: p.label }));
    if (p.id === "opencode") sec.append(opencodeTable());
    sec.append(agentTable(p.id, p.label));
    box.append(sec);
  }
}

function showWarnings(target, list) {
  target.replaceChildren();
  if (!list.length) return;
  target.append(el("div", { class: "warnings" }, el("strong", { textContent: "Varování" }), el("ul", {}, ...list.map((w) => el("li", { textContent: w })))));
}

function render() {
  const active = document.activeElement && document.activeElement.id;
  renderProviders();
  renderTables();
  if (active) ($(active) || $(active.replace(/-reset$/, "")))?.focus();
}

async function load() {
  const box = $("load-error");
  box.replaceChildren();
  try {
    const r = await fetch("/api/state", { headers });
    if (!r.ok) throw new Error("HTTP " + r.status);
    state = await r.json();
  } catch (e) {
    const retry = el("button", { type: "button", textContent: "Zkusit znovu" });
    retry.onclick = load;
    box.append(el("p", { class: "bad", textContent: "Nelze načíst nastavení (neplatný token nebo server neodpovídá). Otevřete znovu adresu, kterou vypsal `make setup`, nebo to zkuste znovu. " }), retry);
    return;
  }
  const s = state.settings;
  draft = {
    providers: new Set(state.providers.filter((p) => p.selected).map((p) => p.id)),
    agents: clone(s.agents && typeof s.agents === "object" ? s.agents : {}),
    opencode: clone(s.opencode && typeof s.opencode === "object" ? s.opencode : {}),
  };
  setDirty(false);
  showWarnings($("warnings"), state.warnings);
  updateHints();
  render();
}

$("save").onclick = async () => {
  const btn = $("save");
  if (!state || !draft || saving) return;
  if (!draft.providers.size && !confirm("Není vybrán žádný poskytovatel. Uložením se odstraní všechny linky. Pokračovat?")) return;
  saving = true;
  btn.disabled = true;
  $("status").className = ""; $("error").textContent = "";
  $("status").textContent = "Ukládám a instaluji…";
  try {
    const order = state.providers.map((p) => p.id).filter((id) => draft.providers.has(id));
    const r = await fetch("/api/save", { method: "POST", headers: { ...headers, "Content-Type": "application/json" }, body: JSON.stringify({ providers: order, agents: draft.agents, opencode: draft.opencode }) });
    const data = await r.json();
    if (!r.ok) { $("status").textContent = ""; $("error").textContent = "Nelze uložit: " + (data.message || data.error); return; }
    setDirty(false);
    if (data.ok) { $("status").textContent = "Uloženo."; $("status").className = "ok"; }
    else { $("status").textContent = ""; $("error").textContent = "Instalace skončila chybou."; }
    $("result").hidden = false;
    $("log").textContent = data.log;
    showWarnings($("result-warnings"), data.warnings);
    const s = await fetch("/api/state", { headers });
    if (s.ok) { state = await s.json(); showWarnings($("warnings"), state.warnings); render(); }
  } catch (e) {
    $("status").textContent = ""; $("error").textContent = "Chyba: " + e;
  } finally { saving = false; btn.disabled = false; }
};
load();
</script>
</body>
</html>
