# Settings of every agent for every provider. Instructions and description live in agents/<name>.md.
# Run scripts/build-agents after a change; it writes generated/<provider>/agents/.
#
# Shared keys:  readonly (no file edits), skills (read or preloaded before starting)
# claude:       model, effort, tools, color
# codex:        model, effort (model_reasoning_effort)
# cursor:       model (full Cursor model ID, effort included)
# opencode:     model (provider/model), variant
# A provider table left out means the agent is not generated for that provider.

[ees-check-runner]
readonly = true
claude = { model = "haiku", effort = "low", tools = ["Bash", "Read", "Grep", "Glob"], color = "cyan" }
codex = { model = "gpt-6-luna", effort = "low" }
cursor = { model = "grok-4.7-low" }
opencode = { model = "opencode-go/deepseek-v4.1-flash", variant = "low" }

[ees-code-reviewer]
claude = { model = "sonnet", effort = "medium", color = "red" }
codex = { model = "gpt-6.1-terra", effort = "medium" }
cursor = { model = "grok-4.7-medium" }
opencode = { model = "opencode-go/deepseek-v4.1-flash", variant = "high" }

[ees-functional-reviewer]
readonly = true
claude = { model = "sonnet", effort = "medium", tools = ["Read", "Grep", "Glob", "Bash"], color = "purple" }
codex = { model = "gpt-6.1-terra", effort = "medium" }
cursor = { model = "grok-4.7-medium" }
opencode = { model = "opencode-go/deepseek-v4.1-flash", variant = "high" }

[ees-implementer]
claude = { model = "sonnet", effort = "high", color = "green" }
codex = { model = "gpt-6.1-terra", effort = "medium" }
cursor = { model = "grok-4.7-medium" }
opencode = { model = "opencode-go/deepseek-v4.1-flash", variant = "max" }

[ees-test-writer]
skills = ["ees-tdd"]
claude = { model = "sonnet", effort = "high", color = "yellow" }
codex = { model = "gpt-6.1-terra", effort = "medium" }
cursor = { model = "grok-4.7-medium" }
opencode = { model = "opencode-go/deepseek-v4.1-flash", variant = "max" }

[ees-ux-reviewer]
claude = { model = "sonnet", effort = "medium", color = "pink" }
codex = { model = "gpt-6.1-terra", effort = "medium" }
cursor = { model = "grok-4.7-medium" }
opencode = { model = "opencode-go/deepseek-v4.1-flash", variant = "high" }
